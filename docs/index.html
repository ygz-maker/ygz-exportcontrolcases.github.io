  .brand-org{
    font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","楷体",cursive;
    font-size:22px; font-weight:400; color:var(--ink); letter-spacing:.08em;
    line-height:1.1;
  }
  .brand-text{display:flex; flex-direction:column;}
  .brand-top{margin-bottom:4px;}
  .kicker{
    font-size:11px; letter-spacing:.18em; color:var(--accent);
    font-weight:700;
  }
  h1{
    font-family:Georgia,"Songti SC","SimSun",serif;
    font-size:34px; font-weight:700; letter-spacing:.02em;
  }
  .sub{color:var(--muted); font-size:14px; margin-top:6px;}
  .stats{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .stat{
    font-size:12px; padding:3px 10px; border-radius:999px;
    border:1px solid var(--line); background:#fff; color:var(--muted);
  }
  .stat b{color:var(--ink); font-weight:700;}

  /* ===== 工具栏 ===== */
  .toolbar{position:sticky; top:0; background:var(--bg); padding:10px 0 12px; z-index:10;}
  .search{
    width:100%; padding:12px 16px; font-size:15px; border-radius:10px;
    border:1px solid var(--line); background:#fff; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(180,83,9,.15);}
  .cats{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .pill{
    font-size:13px; padding:6px 14px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--muted);
    transition:all .15s; user-select:none;
  }
  .pill:hover{border-color:var(--ink); color:var(--ink);}
  .pill.on{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600;}
  .pill .n{opacity:.7; margin-left:4px; font-size:12px;}

  /* ===== 案例列表 ===== */
  .list{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; cursor:pointer; transition:box-shadow .15s, border-color .15s;
  }
  .card:hover{box-shadow:0 4px 14px rgba(32,36,43,.08); border-color:#C9C4BA;}
  .card.open{border-color:var(--accent);}
  .card-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .seq{
    font-size:11px; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:0 6px; line-height:1.8;
  }
  .cat-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px;}
  .ct-外国对外国{background:var(--c1-bg); color:var(--c1);}
  .ct-外国对中国{background:var(--c2-bg); color:var(--c2);}
  .ct-中国对外国{background:var(--c3-bg); color:var(--c3);}
  .ct-中国对中国{background:var(--c4-bg); color:var(--c4);}
  .country{
    font-size:11px; padding:2px 8px; border-radius:4px;
    background:var(--accent-soft); color:var(--accent); font-weight:600;
  }
  .name{

var CATS = ["全部","外国对外国","外国对中国","中国对外国","中国对中国"];
var state = { q:"", cat:"全部" };

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderStats(){
  var el = document.getElementById("stats");
  var html = "";
  CATS.slice(1).forEach(function(c){
    var n = DATA.filter(function(d){return d.cat===c;}).length;
    html += '<span class="stat"><b>'+n+'</b> 个 · '+esc(c)+'</span>';
  });
  html += '<span class="stat">共 <b>32</b> 个案例</span>';
  el.innerHTML = html;
}

function renderCats(){
  var el = document.getElementById("cats");
  var html = "";
  CATS.forEach(function(c){
    var n = c==="全部" ? DATA.length : DATA.filter(function(d){return d.cat===c;}).length;
    var on = state.cat===c ? " on" : "";
    html += '<div class="pill'+on+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="n">'+n+'</span></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll(".pill").forEach(function(p){
    p.addEventListener("click", function(){
      state.cat = p.getAttribute("data-cat");
      renderCats(); renderList();
    });
  });
}

function visible(d){
  if(state.cat!=="全部" && d.cat!==state.cat) return false;
  if(!state.q) return true;
  var hay = [d.name,d.country,d.time,d.enforcer,d.violator,d.product,d.amount,d.penalty,d.note,d.cat].join(" ");
  return hay.toLowerCase().indexOf(state.q.toLowerCase()) >= 0;
}

function renderList(){
  var el = document.getElementById("list");
  var list = DATA.filter(visible);
  if(!list.length){
    el.innerHTML = '<div class="empty">没有匹配的案例，换个关键词或类别试试</div>';
    return;
  }
  var html = "";
  list.forEach(function(d){
    html += '' +
    '<div class="card" data-seq="'+d.seq+'">' +
      '<div class="card-top">' +
        '<span class="seq">#'+d.seq+'</span>' +
        '<span class="cat-tag ct-'+esc(d.cat)+'">'+esc(d.cat)+'</span>' +
        (d.country ? '<span class="country">'+esc(d.country)+'</span>' : '') +
      '</div>' +
      '<div class="name">'+esc(d.name)+'</div>' +
      '<div class="brief">' +
        '<span>'+esc(d.time)+'</span>' +
        '<span><b>执法方：</b>'+esc(d.enforcer)+'</span>' +
        '<span><b>被管制方：</b>'+esc(d.violator)+'</span>' +
      '</div>' +
      '<div class="detail">' +
        (d.product  ? '<div class="drow"><div class="k">涉案产品</div><div class="v">'+esc(d.product)+'</div></div>' : '') +
        (d.amount   ? '<div class="drow"><div class="k">涉案金额</div><div class="v">'+esc(d.amount)+'</div></div>' : '') +
        (d.penalty  ? '<div class="drow"><div class="k">处罚力度</div><div class="v">'+esc(d.penalty)+'</div></div>' : '') +
        (d.note     ? '<div class="drow"><div class="k">备注</div><div class="v">'+esc(d.note)+'</div></div>' : '') +
      '</div>' +
    '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll(".card").forEach(function(card){
    card.addEventListener("click", function(){ card.classList.toggle("open"); });
  });
}

document.getElementById("search").addEventListener("input", function(e){
  state.q = e.target.value;
  renderList();
});

renderStats(); renderCats(); renderList();
</script>
